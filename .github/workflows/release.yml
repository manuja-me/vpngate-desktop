name: Release Standalone Windows Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Release Binary (MSVC Static WebView2)
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Release Artifacts
        id: prepare
        shell: pwsh
        run: |
          $ver = if ("${{ inputs.tag_name }}") { "${{ inputs.tag_name }}" } else { "${{ github.ref_name }}" }
          if (-not $ver -or $ver -eq "main") { $ver = "v2.0.0" }
          
          # Create output staging directory
          New-Item -ItemType Directory -Path "release_pkg" -Force
          
          # 1. Standalone binary (MSVC statically links WebView2LoaderStatic.lib)
          Copy-Item -Path "target\x86_64-pc-windows-msvc\release\vpngate.exe" -Destination "release_pkg\VpnGate.exe" -Force
          
          # 2. Portable zip bundle
          $zipFolder = "release_pkg\VpnGate-$ver-Windows-x64"
          New-Item -ItemType Directory -Path $zipFolder -Force
          Copy-Item -Path "target\x86_64-pc-windows-msvc\release\vpngate.exe" -Destination "$zipFolder\VpnGate.exe"
          Copy-Item -Path "install_openvpn.bat" -Destination "$zipFolder\install_openvpn.bat"
          Copy-Item -Path "README.md" -Destination "$zipFolder\README.md"
          Copy-Item -Path "LICENSE" -Destination "$zipFolder\LICENSE"
          
          # Include fallback loader DLL in zip for maximum compatibility
          if (Test-Path "assets\WebView2Loader.dll") {
            Copy-Item -Path "assets\WebView2Loader.dll" -Destination "$zipFolder\WebView2Loader.dll"
          }
          
          $zipPath = "release_pkg\VpnGate-$ver-Windows-x64.zip"
          Compress-Archive -Path "$zipFolder\*" -DestinationPath $zipPath -Force
          
          # 3. Generate SHA256 Checksums
          $hashExe = (Get-FileHash -Path "release_pkg\VpnGate.exe" -Algorithm SHA256).Hash
          $hashZip = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          $leafName = Split-Path $zipPath -Leaf
          
          $checksumLines = @(
            "$hashExe  VpnGate.exe",
            "$hashZip  $leafName"
          )
          Set-Content -Path "release_pkg\sha256sums.txt" -Value $checksumLines
          
          echo "tag=$ver" >> $env:GITHUB_OUTPUT
          echo "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: "VPN Gate Studio ${{ steps.prepare.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_pkg/VpnGate.exe
            ${{ steps.prepare.outputs.zip_path }}
            release_pkg/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
